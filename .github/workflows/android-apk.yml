name: Build Android APK

# Builds a fresh, installable APK on every push and publishes it as a rolling
# "latest" release, so the newest build is always at one stable URL:
#   https://github.com/<owner>/<repo>/releases/tag/latest-apk
# The APK is debug-signed (no secrets needed) — fine for sideloading onto a
# phone. Play Store release builds still use android/keystore.properties locally.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cadence-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cadence-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners already include the Android SDK ($ANDROID_HOME);
      # Gradle downloads any missing platform/build-tools once licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      # The UI is bundled inside the APK (static export -> ./out), so a fresh
      # build of the web code is part of every APK. It talks to the production
      # API at https://cadence.buildc3.tech (override with NEXT_PUBLIC_API_BASE).
      - name: Build the app UI bundle
        run: npm run build:native

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: cadence-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "Cadence-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk Cadence-latest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cadence-apk
          path: cadence-app/Cadence-*.apk

      - name: Publish rolling release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest-apk Cadence-latest.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cadence APK (latest)" \
            --notes "Auto-built from ${GITHUB_SHA::7} on every push to main. Debug-signed; sideload onto an Android phone." \
            --prerelease
