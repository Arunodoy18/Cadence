name: Build Android APK

# Builds a fresh, installable APK on every push and publishes it as a rolling
# "latest" release, so the newest build is always at one stable URL:
#   https://github.com/<owner>/<repo>/releases/tag/latest-apk
# The APK is debug-signed (no secrets needed) — fine for sideloading onto a
# phone. Play Store release builds still use android/keystore.properties locally.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cadence-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cadence-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners already include the Android SDK ($ANDROID_HOME);
      # Gradle downloads any missing platform/build-tools once licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      # The UI is bundled inside the APK (static export -> ./out), so a fresh
      # build of the web code is part of every APK. It talks to the production
      # API at https://cadence.buildc3.tech (override with NEXT_PUBLIC_API_BASE).
      - name: Build the app UI bundle
        run: npm run build:native

      - name: Sync Capacitor
        run: npx cap sync android

      # Android only installs an APK over an existing one if both are signed with
      # the SAME key. Without a stable key, every CI run signs with a fresh random
      # debug key and phones refuse the update ("App not installed"). So when the
      # signing secrets exist (see scripts/set-ci-signing-secrets.sh) we build a
      # properly signed release APK; otherwise we fall back to an unsigned-key
      # debug build that works for a first install only.
      - name: Build APK
        id: build
        working-directory: cadence-app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 --decode > ci-release.jks
            printf 'storeFile=ci-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties
            ./gradlew assembleRelease bundleRelease --no-daemon
            echo "aab=app/build/outputs/bundle/release/app-release.aab" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "signed=stable release key" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug --no-daemon
            echo "apk=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "signed=temporary debug key (updates need uninstall first)" >> "$GITHUB_OUTPUT"
          fi

      - name: Name the APK
        run: |
          cp "android/${{ steps.build.outputs.apk }}" "Cadence-${GITHUB_SHA::7}.apk"
          cp "android/${{ steps.build.outputs.apk }}" Cadence-latest.apk
          if [ -n "${{ steps.build.outputs.aab }}" ]; then cp "android/${{ steps.build.outputs.aab }}" Cadence-play-store.aab; fi

      - uses: actions/upload-artifact@v4
        with:
          name: cadence-apk
          path: cadence-app/Cadence-*.apk

      - name: Publish rolling release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest-apk Cadence-latest.apk $(ls Cadence-play-store.aab 2>/dev/null) \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cadence APK (latest)" \
            --notes "Auto-built from ${GITHUB_SHA::7} on every push to main. Signed with: ${{ steps.build.outputs.signed }}. Sideload onto an Android phone." \
            --prerelease
